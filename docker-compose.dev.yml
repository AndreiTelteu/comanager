services:
  backend:
    image: golang:1.25
    working_dir: /app
    command: sh -c "go install github.com/air-verse/air@latest && air -c .air.toml"
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 8080
    volumes:
      - .:/app
      - ./data:/app/data
      - ./projects:/app/projects
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8080:8080"
  frontend:
    image: node:20-bullseye
    working_dir: /app/frontend
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3000:3000"
